- id: intelligence
  title: Structure & analyse
  icon: fas fa-project-diagram
  summary: Turn atomic observations and rich reports into connected, actionable intelligence.
  features:
    - title: Flexible intelligence model
      description: Describe everything from atomic indicators and selectors to linked objects, tactics, techniques, and detailed Markdown reports.
    - title: High-performance correlation
      description: Reveal relationships through exact matches and advanced patterns, including fuzzy hashes and CIDR overlaps, with granular controls.
    - title: Analyst collaboration
      description: Add opinions, relationships, comments, sightings, proposals, and counter-analysis directly to shared intelligence.
    - title: Context and vocabularies
      description: Apply shareable taxonomies, warning lists, and MISP galaxies for threat actors, malware, ransomware, tools, and MITRE ATT&CK.
    - title: Visual exploration
      description: Navigate correlations and build event graphs that connect events, objects, and attributes into a coherent picture.

- id: sharing
  title: Share & collaborate
  icon: fas fa-people-arrows
  summary: Exchange intelligence with the right communities while retaining precise control over distribution.
  features:
    - title: Granular sharing controls
      description: Use distribution levels and custom sharing groups, down to individual attributes, to match each organisation's sharing policy.
    - title: Real-time synchronisation
      description: Automatically exchange events, attributes, and higher-level intelligence among MISP instances and trusted communities.
    - title: Delegated publishing
      description: Delegate publication to a trusted community through a simple, pseudo-anonymous sharing mechanism.
    - title: Secure notifications
      description: Sign and encrypt notifications with GnuPG or S/MIME according to each user's preferences.
    - title: Information integrity
      description: Sign and validate shared information for diverse and sensitive information-sharing communities.

- id: automation
  title: Automate & integrate
  icon: fas fa-cogs
  summary: Connect MISP to your security stack and turn intelligence into repeatable, automated action.
  features:
    - title: Extensive REST API
      description: Access all intelligence through an OpenAPI-described API, exhaustive restSearch capabilities, and the bundled PyMISP library.
      link: /openapi/
    - title: Custom workflows
      description: Build automatic data pipelines for qualification, analysis, modification, and publication control.
    - title: Enrichment modules
      description: Extend MISP with Python expansion, import, and export modules or connect your own services.
      link: https://github.com/MISP/misp-modules
    - title: Real-time streaming
      description: Publish new events, indicators, sightings, and tagging changes through ZMQ or Kafka channels.
    - title: Built-in API tooling
      description: Build, test, and analyse complex queries in the interface with a context-aware, templated API client.

- id: interoperability
  title: Import & export
  icon: fas fa-exchange-alt
  summary: Move intelligence freely with open standards, common security formats, and adaptable modules.
  features:
    - title: Broad export support
      description: Generate MISP JSON, STIX 1 and 2, OpenIOC, CSV, text, Suricata, Snort, Zeek, RPZ, forensic cache formats, and more.
    - title: Flexible ingestion
      description: Import MISP, STIX, CSV, proprietary formats, URLs, batches, sandbox results, and bulk data through the UI or API.
    - title: Free-text conversion
      description: Extract structured reports, objects, and attributes from unstructured text and externally hosted reports.
    - title: MISP Standard Format
      description: Rely on a stable, backward-compatible format adopted by tools and organisations around the world.
      link: https://www.misp-standard.org/
    - title: STIX interoperability
      description: Import and export STIX 1 and 2 content through the actively maintained misp-stix library.
      link: https://github.com/MISP/misp-stix

- id: operations
  title: Operate at scale
  icon: fas fa-tachometer-alt
  summary: Deploy a robust platform with the controls and observability required by organisations of any size.
  features:
    - title: Deployment flexibility
      description: Run MISP on-premise, in the cloud, or as a SaaS solution for teams and communities of any size.
    - title: Custom dashboards
      description: Create and share composable dashboards or build bespoke monitoring views in a drag-and-drop interface.
    - title: Auditable logging
      description: Track system and user activity with flexible logging formats and transports for centralised monitoring.
    - title: Customisable RBAC
      description: Configure permissive internal deployments or tightly regulated community instances with role-based access controls.
    - title: Batteries included
      description: Use tooling for backups, identity and authentication integration, leakage prevention, and system monitoring.

- id: open
  title: Open by design
  icon: fas fa-lock-open
  summary: Build on a transparent, community-owned foundation without proprietary lock-in.
  features:
    - title: Open-source commitment
      description: MISP's contributor-owned licensing ensures the platform cannot be converted into a closed or proprietary product.
    - title: Open data model and API
      description: Integrate without lock-in using documented formats, open standards, and a comprehensive API.
    - title: Extensible ecosystem
      description: Adapt export modules, enrichment services, taxonomies, galaxies, object templates, and workflows to your needs.
    - title: Community-powered
      description: Benefit from an international community that develops software, open standards, knowledge bases, and integrations together.
