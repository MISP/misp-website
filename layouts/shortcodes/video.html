{{- $title := .Get "title" | default "Video" -}}
<div class="myvideo" data-video-player>
    <video controls loop playsinline preload="metadata" aria-label="{{ $title }}">
        <source src="{{ .Get "src" }}"{{ with .Get "type" }} type="{{ . }}"{{ end }}>
        Sorry, cannot display the video as the video tag is not supported by your browser.
    </video>
    <button class="video-play" type="button" aria-label="Play {{ $title }}" data-video-play hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        <span>Play video</span>
    </button>
</div>
