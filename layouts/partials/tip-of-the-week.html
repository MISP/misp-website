<section class="tip-of-the-week" aria-labelledby="tip-of-the-week-title">
  <div class="container">
    <div class="tip-of-the-week__card">
      <div class="tip-of-the-week__icon" aria-hidden="true">
        <i class="fas fa-lightbulb"></i>
      </div>
      <div class="tip-of-the-week__content">
        <span class="tip-of-the-week__eyebrow">MISP tip of the week</span>
        <h2 id="tip-of-the-week-title">A useful tip from the MISP community</h2>
        <p id="tip-of-the-week-text" class="tip-of-the-week__text" aria-live="polite">Loading a tip&hellip;</p>
        <a id="tip-of-the-week-link" class="tip-of-the-week__link" href="https://github.com/cudeso/misp-tip-of-the-week" target="_blank" rel="noopener noreferrer" hidden>
          Learn more <i class="fas fa-arrow-right" aria-hidden="true"></i>
        </a>
      </div>
      <button id="tip-of-the-week-refresh" class="tip-of-the-week__refresh" type="button" aria-label="Show another MISP tip" title="Show another tip" hidden>
        <i class="fas fa-random" aria-hidden="true"></i>
        <span>Another tip</span>
      </button>
    </div>
  </div>
</section>
<script src="{{ "js/tip-of-the-week.js" | relURL }}" defer></script>
